name: Build Debug APK

on:
  push:
    branches: [ "claude/android-app-fe149b" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK licenses and install components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create local.properties
        working-directory: QuranTabarak
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        working-directory: QuranTabarak
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranTabarak-debug-apk
          path: QuranTabarak/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Report APK info
        run: |
          APK=QuranTabarak/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "✓ APK built successfully"
            ls -lh "$APK"
          else
            echo "✗ APK not found"
            exit 1
          fi
